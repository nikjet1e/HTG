<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi Mui Guide — Villie &amp; Saw</title>
<meta name="theme-color" content="#B3122B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Archivo+Narrow:wght@600;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6F4; --panel:#FFFFFF; --ink:#201A1C; --dim:#6E6266; --faint:#9A8E92;
  --line:#E4DBD7; --red:#B3122B; --red-soft:#FBEDEF; --gold:#9C7A2E;
  --g-out:#2F6B4F; --g-front:#9A6B14; --g-bed:#B3122B; --rainc:#2D6079;
  --sans:'Archivo',system-ui,sans-serif; --narrow:'Archivo Narrow','Archivo',sans-serif;
  --tabh:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}

/* ---------- masthead + clock ---------- */
.top{background:var(--ink);color:#fff;padding:14px 16px 12px;position:relative;overflow:hidden}
.top .xi{position:absolute;right:-10px;top:-24px;font-family:'Noto Serif SC',serif;font-size:110px;color:#fff;opacity:.06;line-height:1;pointer-events:none}
.top h1{font-family:var(--narrow);font-size:19px;font-weight:700;letter-spacing:.01em}
.top .sub{font-size:11.5px;color:#BFB3B6;margin-top:1px}
.cd{margin-top:12px}
.cdunits{display:flex;gap:7px}
.cdu{background:rgba(255,255,255,.09);border-radius:7px;padding:7px 0;text-align:center;flex:1;min-width:0}
.cdu b{display:block;font-family:var(--narrow);font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cdu span{display:block;font-size:9.5px;color:#BFB3B6;margin-top:3px;letter-spacing:.04em}
.cdlab{font-size:11px;color:#BFB3B6;margin-top:7px}
.nowline{margin-top:11px;font-size:13px;line-height:1.4}
.nowline[hidden]{display:none}
.nowline b{display:block;font-weight:700}
.nowline span{color:#BFB3B6;font-size:11.5px}
.cd[hidden]{display:none}

/* ---------- tabs: thin, scrolling ---------- */
.tabs{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none;height:var(--tabh);align-items:stretch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:0 15px;font-size:13.5px;font-weight:600;color:var(--dim);
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--red);border-bottom-color:var(--red)}

main{padding:16px 14px 64px;max-width:760px;margin:0 auto}
.hd{font-family:var(--narrow);font-size:21px;font-weight:700;margin-bottom:3px}
.lede{font-size:13.5px;color:var(--dim);margin-bottom:15px;max-width:62ch}
section[hidden]{display:none}

/* ---------- run sheet ---------- */
.run{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:none}
.row .tm{font-family:var(--narrow);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim)}
.row .nm{font-size:14px;font-weight:600;line-height:1.3}
.row .ow{font-size:11.5px;color:var(--dim);margin-top:1px}
.row .mn{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.row.walk{background:#F4F1EF}.row.walk .nm{font-weight:400;font-style:italic;color:var(--dim);font-size:13px}
.row.fr{background:var(--red-soft)}.row.fr .nm{color:var(--red)}.row.fr .tm{color:var(--red)}
.row.now{background:var(--ink)}
.row.now .nm,.row.now .tm{color:#fff}.row.now .ow,.row.now .mn{color:#BFB3B6}
.row.done{opacity:.45}
.run .end{padding:10px 12px;background:var(--red);color:#fff;display:flex;justify-content:space-between;font-size:13px;font-weight:600}

/* ---------- game cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;margin-bottom:11px;overflow:hidden}
.card.out{border-left-color:var(--g-out)}.card.front{border-left-color:var(--g-front)}
.card.bed{border-left-color:var(--g-bed)}.card.rain{border-left-color:var(--rainc)}
.chd{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:13px 13px;width:100%;text-align:left}
.chd .n{font-family:var(--narrow);font-size:23px;font-weight:700;line-height:.95}
.card.out .chd .n{color:var(--g-out)}.card.front .chd .n{color:var(--g-front)}
.card.bed .chd .n{color:var(--g-bed)}.card.rain .chd .n{color:var(--rainc)}
.chd h3{font-size:15.5px;font-weight:600;line-height:1.25}
.chd .meta{font-size:11.5px;color:var(--faint);margin-top:2px}
.chd .tme{font-family:var(--narrow);font-weight:700;font-size:12px;color:var(--gold);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:22px;height:22px;flex:0 0 auto;align-self:center;display:grid;place-items:center;color:var(--faint);transition:transform .2s}
[aria-expanded=true] .chev{transform:rotate(180deg)}
.cbody{padding:0 13px 14px;border-top:1px solid var(--line);margin-top:2px}
.owner{display:flex;justify-content:space-between;gap:8px;background:#F4F1EF;border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:11px 0 3px;font-size:12.5px;flex-wrap:wrap}
.owner b{font-weight:700}
.owner .all{color:var(--red);font-weight:700;font-size:11.5px}
.sec{margin-top:13px}
.sec>h4{font-family:var(--narrow);font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:5px;text-transform:uppercase}
.sec.obj>h4{color:var(--red)}.sec.rul>h4{color:var(--gold)}.sec.ang>h4{color:#7A5A18}
.sec.chi>h4{color:#2D6079}.sec.aud>h4{color:var(--g-out)}.sec.kit>h4{color:#5A4A44}
.obj p{font-weight:600;font-size:14px}
ol.r{padding-left:19px}ol.r li{margin-bottom:4px;font-size:13.5px}
ol.r li::marker{color:var(--red);font-weight:700}
ul.p{list-style:none}ul.p li{font-size:13.5px;padding-left:15px;position:relative;margin-bottom:3px}
ul.p li:before{content:'';position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
ul.p.a li{color:#7A5A18}ul.p.a li b{color:#5E4512}
.roles{width:100%;border-collapse:collapse}
.roles td{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.roles td:last-child{width:44%}
.roles input{width:100%;border:none;border-bottom:1px dashed var(--line);background:none;font:inherit;font-size:12.5px;padding:2px 0;color:var(--red)}
.roles input::placeholder{color:var(--faint);font-style:italic}
.kitrow{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.kitrow:last-child{border-bottom:none}
.kitrow input{margin-top:3px;width:17px;height:17px;accent-color:var(--g-out);flex:0 0 auto}
.kitrow .where{display:block;font-size:11.5px;color:var(--faint)}
.kitrow.miss .where{color:var(--red);font-weight:600}
.kitrow.got span{opacity:.5;text-decoration:line-through}
.map{width:100%;border-radius:8px;margin-top:11px;display:block;border:1px solid var(--line)}
.ptab{width:100%;border-collapse:collapse;margin-top:7px;font-size:12.5px}
.ptab th{background:#F4F1EF;font-size:10.5px;font-weight:700;text-align:left;padding:5px 7px;border:1px solid var(--line)}
.ptab td{padding:5px 7px;border:1px solid var(--line);vertical-align:top}
.ptab .blank{color:var(--red);font-weight:700}

/* ---------- forfeit round ---------- */
.fr-block{border:2px solid var(--red);background:var(--red-soft);border-radius:10px;padding:14px;margin-bottom:11px}
.fr-block h3{font-family:var(--narrow);color:var(--red);font-size:17px;font-weight:700}
.fr-block .fs{font-size:12px;color:var(--dim);margin-bottom:9px}
.fr-block .fs b{color:var(--red)}
.tally{width:100%;border-collapse:collapse;margin-top:9px;font-size:12.5px;background:#fff}
.tally th{background:#F6E6E8;font-size:10px;font-weight:700;padding:6px 5px;border:1px solid #E3C8CC;text-align:left}
.tally td{padding:5px;border:1px solid #E3C8CC;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:24px;height:24px;border:1px solid #D9BDC1;border-radius:5px;background:#fff;font-weight:700;color:var(--red);line-height:1}
.stepper span{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tally select{border:1px solid #D9BDC1;border-radius:5px;padding:3px 4px;font:inherit;font-size:12px;background:#fff;width:100%}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.lvl{background:#fff;border:1px solid #E3C8CC;border-radius:7px;padding:8px 6px;text-align:center}
.lvl .k{font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.03em}
.lvl .v{font-family:var(--narrow);font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lvl .d{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.25;min-height:2.4em}

/* ---------- ladders ---------- */
.ladhd{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid;padding-bottom:6px;margin:18px 0 9px}
.ladhd h3{font-family:var(--narrow);font-size:18px;font-weight:700}
.ladhd span{font-size:11.5px;color:var(--faint)}
.note{border:1px solid var(--line);border-left:3px solid;background:var(--panel);border-radius:7px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.rungs{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:10px}
.rung{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rung b{font-family:var(--narrow);min-width:19px;font-variant-numeric:tabular-nums}
@media(max-width:560px){.rungs{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)}}

/* ---------- generic ---------- */
.callout{border:1px solid;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:11px}
.callout.warn{border-color:var(--gold);background:#FBF5E9}
.callout.stop{border-color:var(--red);background:var(--red-soft)}
.callout.info{border-color:var(--rainc);background:#ECF3F6}
.callout b{font-weight:700}
.open{width:100%;border-collapse:collapse;font-size:13px}
.open td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.open td:first-child{width:22px;font-weight:700;color:var(--red);font-family:var(--narrow)}
.open .it{font-weight:600;color:var(--red)}
.open .dt{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.grp{font-family:var(--narrow);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);margin:20px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.grp.out{color:var(--g-out);border-color:var(--g-out)}
.grp.front{color:var(--g-front);border-color:var(--g-front)}
.grp.bed{color:var(--g-bed);border-color:var(--g-bed)}
.grp.rain{color:var(--rainc);border-color:var(--rainc)}
.grp span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint)}
.reset{margin-top:22px;font-size:12px;color:var(--faint);text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

ack to the house"]}};

/* ---------- persistence ---------- */
let S={roles:{},kit:{},pts:{},dice:{}};
try{const v=localStorage.getItem('chimui');if(v)S=Object.assign(S,JSON.parse(v));}catch(e){}

/* ---------- schedule ---------- */
const SCHED=(()=>{
  let t=8*60+10,out=[];
  D.games.forEach(g=>{
    const tr=D.transit[g.n];
    if(tr){out.push({k:'walk',t,mins:tr[0],name:tr[1]});t+=tr[0];}
    const d=g.explain+g.play;
    out.push({k:'game',t,mins:d,g});t+=d;
    const b=D.blocks.find(b=>b.after===g.n);
    if(b){out.push({k:'fr',t,mins:b.mins,b});t+=b.mins;}
  });
  out.push({k:'end',t});
  return out;
})();
const ENDT=SCHED[SCHED.length-1].t;

/* ---------- live clock ---------- */
const DAY='2026-09-19', START_TS=new Date('2026-09-19T08:10:00+08:00').getTime();
function tick(){
  const n=new Date();
  const isDay = n.toLocaleDateString('en-CA',{timeZone:'Asia/Kuala_Lumpur'})===DAY;
  // countdown until the morning itself
  const diff=START_TS-n.getTime();
  const cd=$('#cd'), live=$('#live');
  if(diff>0){
    cd.hidden=false; live.hidden=true;
    const d=Math.floor(diff/864e5), h=Math.floor(diff/36e5)%24, m=Math.floor(diff/6e4)%60, sec=Math.floor(diff/1000)%60;
    $('#cdu').innerHTML=[[d,'days'],[h,'hours'],[m,'mins'],[sec,'secs']]
      .map(u=>`<div class="cdu"><b>${String(u[0]).padStart(2,'0')}</b><span>${u[1]}</span></div>`).join('');
  } else { cd.hidden=true; live.hidden=false; }
  document.querySelectorAll('.row[data-t]').forEach(r=>{r.classList.remove('now','done')});
  if(diff>0 || !isDay) return;
  const mins=n.getHours()*60+n.getMinutes();
  const START=8*60+10;
  let cur=null;
  for(let i=0;i<SCHED.length-1;i++){ if(mins>=SCHED[i].t && mins<SCHED[i+1].t){cur=SCHED[i];break;} }
  const g=$('#nowg'),d=$('#nowd');
  if(mins>=ENDT){g.textContent='Games finished';d.textContent='Declaration at 9:30, serenade at 9:45';}
  else if(cur){
    g.textContent = 'Now: ' + (cur.k==='game'?`${cur.g.n}. ${cur.g.name}`: cur.k==='fr'?cur.b.name: cur.name);
    const left=Math.max(0,(SCHED[SCHED.indexOf(cur)+1].t)-mins);
    d.textContent = cur.k==='game' ? `${D.owners[cur.g.n]} · ${left} min left` : `${left} min left`;
  }
  document.querySelectorAll('.row[data-t]').forEach(r=>{
    const s=+r.dataset.t,e=+r.dataset.e;
    r.classList.toggle('now',mins>=s&&mins<e);
    r.classList.toggle('done',mins>=e);
  });
}

/* ---------- ladders ---------- */
const LAD=Object.fromEntries(D.ladders.map(l=>[l.name,Object.fromEntries(l.rungs)]));
const LNAMES=['Shots','Physical','Performance','Embarrassing'];
function levels(){
  const L={Shots:0,Physical:0,Performance:0,Embarrassing:0};
  D.games.forEach(g=>{const l=S.dice[g.n];if(l&&L[l]!==undefined)L[l]+=(S.pts[g.n]||0);});
  return L;
}
const rung=(n,lv)=>lv<1?'—':lv<=30?LAD[n][lv]:LAD[n][30]+' (and beyond)';

/* ---------- views ---------- */
const V={};

V.run=()=>{
  let h=`<h2 class="hd">Run sheet</h2><p class="lede">Andrea's window is 8:10 to 9:30. The current item highlights itself. Owners run their game and prep it.</p><div class="run">`;
  SCHED.forEach((s,i)=>{
    if(s.k==='end'){
      h+=`<div class="end"><span>${clk(s.t)} · Finish</span><span>${s.t<=570?'Inside the window':(s.t-570)+' min over'}</span></div>`;return;
    }
    const e=SCHED[i+1].t;
    if(s.k==='walk') h+=`<div class="row walk" data-t="${s.t}" data-e="${e}"><div class="tm">${clk(s.t)}</div><div><div class="nm">${esc(s.name)}</div></div><div class="mn">${s.mins}m</div></div>`;
    else if(s.k==='fr') h+=`<div class="row fr" data-t="${s.t}" data-e="${e}"><div class="tm">${clk(s.t)}</div><div><div class="nm">${esc(s.b.name)}</div><div class="ow">All four chi muis run it together</div></div><div class="mn">${s.mins}m</div></div>`;
    else h+=`<div class="row" data-t="${s.t}" data-e="${e}"><div class="tm">${clk(s.t)}</div><div><div class="nm">${s.g.n}. ${esc(s.g.name)}</div><div class="ow">${esc(D.owners[s.g.n])} · preps during: ${esc(PREP[s.g.n])}</div></div><div class="mn">${fm(s.mins)}m</div></div>`;
  });
  h+=`</div>
  <div class="callout warn" style="margin-top:14px"><b>Two jobs before the games start.</b><br>Voice recordings — MX or Viji records Villie and every chi mui saying the same statements, before 7:20. Game 9 does not exist without this.<br>Orange hiding — hide the eight real oranges and the decoys outside before Saw arrives, and keep a written note of every spot.</div>
  <div class="callout info"><b>Villie goes upstairs at 9:15.</b> Games 8 and 9 run in the living room downstairs.</div>`;
  return h;
};
const PREP={1:'prepped before arrival',2:'Real or Invented signs',3:'panel roles — Nikhil runs it',4:'Four Flavours',5:'speaker and song',6:'pose cards',7:'check the oranges',8:'timeline cards',9:'speaker and recordings'};

function cardHTML(g,isRain){
  const cls=GATE[g.gate]||'rain', id='g'+g.n;
  const roles=g.chimui.map((r,i)=>{
    const all=/^ALL |^STONE FACE 1 — ALL|^SPRINT/i.test(r);
    const k=g.n+'-'+i;
    return `<tr><td>${esc(r)}</td><td>${all?'':`<input placeholder="name" value="${esc(S.roles[k]||'')}" data-role="${k}">`}</td></tr>`;
  }).join('');
  const aud=g.audience.map((a,i)=>{
    const none=/^none/i.test(a), k='a'+g.n+'-'+i;
    return `<tr><td>${esc(a)}</td><td>${none?'':`<input placeholder="volunteers" value="${esc(S.roles[k]||'')}" data-role="${k}">`}</td></tr>`;
  }).join('');
  const kit=g.props.map((p,i)=>{
    const [item,done]=p, k='k'+g.n+'-'+i, on=S.kit[k]!==undefined?S.kit[k]:false;
    const parts=item.split('—'), nm=parts[0].trim(), wh=parts[1]?parts[1].trim():(done?'':'Not acquired');
    return `<label class="kitrow ${done?'':'miss'} ${on?'got':''}"><input type="checkbox" data-kit="${k}" ${on?'checked':''}><div><span>${esc(nm)}</span>${wh?`<span class="where">${esc(wh)}</span>`:''}</div></label>`;
  }).join('');
  const poses=g.poses?`<table class="ptab"><tr><th>Group</th><th>Round 1</th><th>Round 2</th><th>Round 3 <span style="font-weight:400;color:#9A8E92">optional</span></th></tr>`+
    g.poses.map(p=>`<tr><td><b>${esc(p[0])}</b></td>`+p.slice(1).map(x=>`<td class="${x==='BLANK'?'blank':''}">${esc(x)}</td>`).join('')+`</tr>`).join('')+`</table>`:'';
  const endsGate=D.blocks.some(b=>b.after===g.n);
  return `<article class="card ${cls}">
    <button class="chd" aria-expanded="false" aria-controls="${id}">
      <div class="n">${g.n}</div>
      <div><h3>${esc(g.name)}</h3><div class="meta">${isRain?esc(g.loc):`<b style="color:var(--ink)">${esc(D.owners[g.n])}</b> · ${esc(g.loc)}`}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="tme">${fm(g.explain)}m explain<br>${fm(g.play)}m play</div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </button>
    <div class="cbody" id="${id}" hidden>
      ${isRain?'':`<div class="owner"><span>Owners <b>${esc(D.owners[g.n])}</b></span>${endsGate?'<span class="all">Forfeit round follows — all four run it</span>':'<span style="color:#9A8E92">Other pair preps the next game</span>'}</div>`}
      <div class="sec obj"><h4>Objective</h4><p>${esc(g.objective)}</p></div>
      <div class="sec rul"><h4>Rules</h4><ol class="r">${g.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>${poses}</div>
      <div class="sec ang"><h4>Angpow modifiers</h4><ul class="p a">${g.angpow.map(a=>`<li><b>[${esc(a[0])}]</b> ${esc(a[1])}</li>`).join('')}</ul></div>
      <div class="sec chi"><h4>Chi mui roles</h4><table class="roles">${roles}</table></div>
      <div class="sec aud"><h4>Audience</h4><table class="roles">${aud}</table></div>
      <div class="sec kit"><h4>What is needed</h4>${kit}</div>
      ${D.maps[g.n]?`<img class="map" src="${D.maps[g.n]}" alt="Playing area for ${esc(g.name)}" loading="lazy">`:''}
    </div>
  </article>`;
}

V.games=()=>{
  let h=`<h2 class="hd">The nine games</h2><p class="lede">Tap a game to open it. Names and kit ticks save on this device.</p>`;
  let gate=null;
  D.games.forEach(g=>{
    if(g.gate!==gate){
      gate=g.gate;
      const gg=D.games.filter(x=>x.gate===gate);
      const mins=gg.reduce((a,c)=>a+c.explain+c.play,0)+D.blocks.filter(b=>b.gate===gate).reduce((a,b)=>a+b.mins,0);
      h+=`<div class="grp ${GATE[gate]}">${esc(gate)}<span>${gg.length} games · ~${fm(mins)} min</span></div>`;
    }
    h+=cardHTML(g);
    const b=D.blocks.find(b=>b.after===g.n);
    if(b) h+=`<div class="callout stop" style="display:flex;gap:11px;align-items:flex-start"><b style="font-family:var(--narrow);font-size:20px;color:var(--red);line-height:1">F${D.blocks.indexOf(b)+1}</b><div><b>${esc(b.name)}</b> · ${b.mins} min · all four chi muis<br><span style="color:#6E6266">Tally it on the Forfeits tab.</span></div></div>`;
  });
  return h;
};

V.forfeits=()=>{
  const L=levels();
  let h=`<h2 class="hd">Forfeit tracker</h2><p class="lede">Points build during play. At the end of each gate, roll the dice once per game — the face is the ladder, the points are the rungs. They perform only the rung they land on.</p>
  <div class="levels">`+LNAMES.map(n=>`<div class="lvl"><div class="k">${n.toUpperCase()}</div><div class="v">${L[n]}</div><div class="d">${L[n]?esc(rung(n,L[n])):'—'}</div></div>`).join('')+`</div>
  <div class="callout warn" style="margin-top:13px"><b>Saw splits every forfeit</b> across the heng tais however he wishes, and cannot exempt himself. If a level lands somewhere brutal, open an angpow negotiation to bring it down.</div>`;
  D.blocks.forEach((b,i)=>{
    const gg=D.games.filter(g=>g.gate===b.gate);
    h+=`<div class="fr-block"><h3>${esc(b.name)}</h3><div class="fs">${b.mins} minutes · end of the ${esc(b.gate)} · <b>all four chi muis run it together</b></div>
      <table class="tally"><tr><th style="width:44%">Game</th><th style="width:26%">Points</th><th>Dice roll — ladder</th></tr>`+
      gg.map(g=>`<tr><td><b>${g.n}</b> ${esc(g.name.split(' ').slice(0,3).join(' '))}</td>
        <td><div class="stepper"><button data-pt="${g.n}" data-d="-1" aria-label="one fewer">−</button><span id="pt${g.n}">${S.pts[g.n]||0}</span><button data-pt="${g.n}" data-d="1" aria-label="one more">+</button></div></td>
        <td><select data-dice="${g.n}"><option value="">—</option>${LNAMES.map(n=>`<option ${S.dice[g.n]===n?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')
      +`</table></div>`;
  });
  D.ladders.forEach(l=>{
    h+=`<div class="ladhd" style="border-color:${l.colour}"><h3 style="color:${l.colour}">${l.name} ladder</h3><span>30 levels</span></div>
      <div class="note" style="border-left-color:${l.colour}">${l.note}</div><div class="rungs">`+
      l.rungs.map(r=>`<div class="rung"><b style="color:${l.colour}">${r[0]}</b><span>${esc(r[1])}</span></div>`).join('')+
      `</div><div class="callout warn" style="margin-top:9px"><b>Past level 30.</b> ${esc(l.overflow)}</div>`;
  });
  return h;
};

V.plan=()=>{
  const alt=(skip,extra)=>{
    let t=8*60+10,rows='';
    D.rain.forEach(r=>{rows+=`<div class="row"><div class="tm">${clk(t)}</div><div><div class="nm">${r.n}. ${esc(r.name)}</div><div class="ow">${esc(RAINOWN[r.n])}</div></div><div class="mn">${fm(r.explain+r.play)}m</div></div>`;t+=r.explain+r.play;});
    const b0=D.blocks[0];
    rows+=`<div class="row fr"><div class="tm">${clk(t)}</div><div><div class="nm">${esc(b0.name)}</div><div class="ow">All four</div></div><div class="mn">${b0.mins}m</div></div>`;t+=b0.mins;
    D.games.filter(g=>!skip.includes(g.n)).forEach(g=>{
      rows+=`<div class="row"><div class="tm">${clk(t)}</div><div><div class="nm">${g.n}. ${esc(g.name)}</div><div class="ow">${esc(D.owners[g.n])}</div></div><div class="mn">${fm(g.explain+g.play)}m</div></div>`;t+=g.explain+g.play;
      const b=D.blocks.find(b=>b.after===g.n);
      if(b&&b!==b0){rows+=`<div class="row fr"><div class="tm">${clk(t)}</div><div><div class="nm">${esc(b.name)}</div><div class="ow">All four</div></div><div class="mn">${b.mins}m</div></div>`;t+=b.mins;}
    });
    D.blocks.forEach(b=>{if(!rows.includes(b.name)){rows+=`<div class="row fr"><div class="tm">${clk(t)}</div><div><div class="nm">${esc(b.name)}</div><div class="ow">All four</div></div><div class="mn">${b.mins}m</div></div>`;t+=b.mins;}});
    return `<div class="run">${rows}<div class="end"><span>${clk(t)} · Finish</span><span>${t<=570?'Inside the window':(t-570)+' min over'}</span></div></div>`;
  };
  return `<h2 class="hd">If the weather turns</h2><p class="lede">Two plans. Both keep the three forfeit rounds and gate 3 exactly as written.</p>
  <div class="grp rain">Rain — cuts the outer gate<span>games 1, 2, 3</span></div>
  <div class="callout info"><b>Rain cuts the Outer Gate only.</b> Games 1, 2 and 3 and the walking come out. R1, R2 and R3 go in, under cover. Gates 2 and 3 run as written.<br><br><b style="color:#B3122B">Called by ____________ at ______</b> — final before Saw's car arrives at 7:50.</div>
  ${alt([1,2,3])}
  <div class="grp rain" style="color:#7A6A3A;border-color:#7A6A3A">Heavy haze — cuts two gates<span>games 1, 2, 3, 7</span></div>
  <div class="callout warn"><b>Heavy haze cuts the Outer Gate and the Front Door.</b> Everything moves indoors. Four Flavours, Copy That Dance and Iconic Poses adapt and move inside — the dance rehearses in a side room. Golden Orange Sweep is cut; the oranges are hidden outside.<br><br><b style="color:#B3122B">Called by ____________ at ______</b> on the API reading — final before 7:50.</div>
  ${alt([1,2,3,7])}
  <div class="grp rain">The three backup games</div>
  ${D.rain.map(r=>cardHTML(r,true)).join('')}`;
};
const RAINOWN={R1:'MX + Viji',R2:'Steph + Jayne',R3:'MX + Viji'};

V.kit=()=>{
  const block=(list,title,sub)=>{
    let h=`<div class="grp">${title}<span>${sub}</span></div>`;
    list.forEach(g=>{
      h+=`<div style="margin-bottom:9px"><div style="font-size:12px;font-weight:700;color:#6E6266;margin-bottom:3px">${g.n}. ${esc(g.name)}</div>`;
      g.props.forEach((p,i)=>{
        const [item,done]=p,k='k'+g.n+'-'+i,on=S.kit[k]||false;
        const parts=item.split('—'),nm=parts[0].trim(),wh=parts[1]?parts[1].trim():(done?'':'Not acquired');
        h+=`<label class="kitrow ${done?'':'miss'} ${on?'got':''}"><input type="checkbox" data-kit="${k}" ${on?'checked':''}><div><span>${esc(nm)}</span>${wh?`<span class="where">${esc(wh)}</span>`:''}</div></label>`;
      });
      h+=`</div>`;
    });
    return h;
  };
  return `<h2 class="hd">Kit list</h2><p class="lede">In the order the games run. Anything in red has not been acquired. Ticks save on this device.</p>
    ${block(D.games,'Games 1 to 9','pack first')}
    ${block(D.rain,'Rain contingency games','only if the plan is called')}
    <button class="reset" id="reset">Clear everything saved on this device</button>`;
};

V.open=()=>{
  const FLAGS=[['Embarrassing ladder','All chi muis to give input on the rungs'],['Performance ladder','All chi muis to give input on the rungs'],
    ['Roles on each game','Every game has name slots against the chi mui roles. They are blank'],
    ['Kit not yet acquired','Everything in red on the kit tab. Beers, cups, oranges, noisemakers, the sour item'],
    ['Who collects the angpows','Every game has angpow modifiers. Nobody is holding the box or counting what comes in'],
    ['Blank poses','Four of the nine pose slots are empty. Chi muis to suggest'],
    ['Rain contingency','Decide who calls it and when'],['Haze contingency','Decide who calls it and when'],
    ['Water gun liquid','See below']];
  return `<h2 class="hd">Before Saturday</h2><p class="lede">These still need a decision or input.</p>
  <table class="open">${FLAGS.map((f,i)=>`<tr><td>${i+1}</td><td><span class="it">${esc(f[0])}</span><span class="dt">${esc(f[1])}</span></td></tr>`).join('')}</table>
  <div class="callout warn" style="margin-top:15px"><b>What goes in the water guns?</b> Every heng tai and Saw will be in a poncho, so the outfits are protected and this is a freer choice than it looks. Plain water works. Worth a thought: coloured water, which shows every hit and photographs well; weak tea, the same idea in a wedding-appropriate colour; 100 Plus or beer, which turn a soaking into something they can taste. Whatever it is, it needs to wash out of hair and off skin.</div>
  <div class="grp">Things to know</div>
  <div class="callout stop"><b>Safety — dodgeballs.</b> Only throw when you are in front of a heng tai and he is facing you. Never throw at someone who cannot see it coming.</div>
  <div class="callout stop"><b>Safety — water guns.</b> Keep them pointed down and never aim for the face.</div>
  <div class="callout warn"><b>Scoring — dodgeballs.</b> A hit counts only if it lands above the knees and below the shoulders. Head and leg hits do not score.</div>
  <div class="callout stop"><b>Duty of care.</b> Ong does not drink and is driving at 10:40 — he takes the non-alcoholic tray, agreed privately, never announced. Andrew is also driving at 10:40, same treatment. Gana is a cardiac patient with stents and a knee injury: no sustained exertion, no sprinting, no floor work, no ice water. Yeoh has a knee replacement: no running, jumping or kneeling. Ong also has a previous ACL reconstruction. Eugene does not sing or dance — route performance forfeits to the speech rungs.<br><br>Anyone running forfeits can stop anything, for anyone, without explaining.</div>`;
};

/* ---------- shell ---------- */
const TABS=[['run','Run sheet'],['games','Games'],['forfeits','Forfeit Tracker'],['plan','Weather'],['kit','Kit'],['open','Before Saturday']];
let cur='run';
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===cur}" data-tab="${k}">${l}</button>`).join('');
  $('#main').innerHTML=V[cur]();
  tick();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){cur=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const c=e.target.closest('.chd');
  if(c){const o=c.getAttribute('aria-expanded')==='true';c.setAttribute('aria-expanded',!o);$('#'+c.getAttribute('aria-controls')).hidden=o;return;}
  const p=e.target.closest('[data-pt]');
  if(p){const n=p.dataset.pt;S.pts[n]=Math.max(0,(S.pts[n]||0)+ +p.dataset.d);save();render();return;}
  if(e.target.id==='reset'){if(confirm('Clear all names, ticks and forfeit counts on this device?')){S={roles:{},kit:{},pts:{},dice:{}};save();render();}}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.kit){S.kit[e.target.dataset.kit]=e.target.checked;save();e.target.closest('.kitrow').classList.toggle('got',e.target.checked);}
  if(e.target.dataset.dice){S.dice[e.target.dataset.dice]=e.target.value;save();render();}
});
document.addEventListener('input',e=>{ if(e.target.dataset.role){S.roles[e.target.dataset.role]=e.target.value;save();} });
render(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
